<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" />
  <title>Cobalt</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <span class="brand-dot"></span>
          <span class="brand-name">Cobalt</span>
          <button class="version-badge" id="version-badge" title="Version history"></button>
        </div>
        <button class="icon-btn" id="btn-new-connection" title="New connection (Ctrl+N)">+</button>
      </div>

      <div class="conn-bar" id="conn-bar"></div>

      <div class="filter-row">
        <input id="schema-filter" class="filter-input" type="text" placeholder="Filter tables…" spellcheck="false" />
      </div>

      <div class="tree" id="tree"></div>

      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>

    <div class="sidebar-resizer" id="sidebar-resizer"></div>

    <main class="main">
      <div class="titlebar" id="titlebar">
        <button class="app-menu-btn" id="app-menu" title="Menu">
          <svg viewBox="0 0 14 14" aria-hidden="true">
            <path d="M2 4h10M2 7h10M2 10h10" />
          </svg>
        </button>
        <div class="tabstrip" id="tabstrip"></div>
        <div class="win-controls" id="win-controls">
          <button class="win-btn" id="win-min" title="Minimise" aria-label="Minimise">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 5h8" /></svg>
          </button>
          <button class="win-btn" id="win-max" title="Maximise" aria-label="Maximise">
            <svg class="ico-max" viewBox="0 0 10 10" aria-hidden="true"><rect x="1.2" y="1.2" width="7.6" height="7.6" rx="1.4" /></svg>
            <svg class="ico-restore" viewBox="0 0 10 10" aria-hidden="true">
              <rect x="1.1" y="3" width="5.9" height="5.9" rx="1.3" />
              <path d="M3.4 3V2.4A1.3 1.3 0 0 1 4.7 1.1h2.9A1.3 1.3 0 0 1 8.9 2.4v2.9A1.3 1.3 0 0 1 7.6 6.6H7" />
            </svg>
          </button>
          <button class="win-btn danger" id="win-close" title="Close" aria-label="Close">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.4 1.4l7.2 7.2M8.6 1.4L1.4 8.6" /></svg>
          </button>
        </div>
      </div>

      <section class="workarea" id="workarea">
        <div class="editor-pane" id="editor-pane">
          <div class="editor-toolbar">
            <button class="conn-picker" id="btn-conn" title="Connection for this tab (Ctrl+K)"></button>
            <span class="tb-sep"></span>
            <button class="btn primary" id="btn-run" title="Run current statement (Ctrl+Enter)">Run</button>
            <button class="btn" id="btn-run-all" title="Run whole script (Ctrl+Shift+Enter)">Run all</button>
            <button class="btn danger hidden" id="btn-cancel" title="Cancel (Ctrl+.)">Cancel</button>
            <span class="tb-sep"></span>
            <button class="btn ghost" id="btn-explain" title="Explain the current statement (Ctrl+Shift+E)">Explain</button>
            <button class="btn ghost" id="btn-benchmark" title="Benchmark the statements in this tab (Ctrl+Shift+B)">Benchmark</button>
            <button class="btn ghost" id="btn-history" title="Query history (Ctrl+H)">History</button>
            <span class="spacer"></span>
            <span class="hint" id="editor-hint"></span>
            <button class="btn ghost" id="btn-more" title="More actions">&#8943;</button>
          </div>
          <div class="editor-host" id="editor-host"></div>
        </div>

        <div class="pane-resizer" id="pane-resizer"></div>

        <div class="result-pane" id="result-pane">
          <div class="data-head" id="data-head" hidden></div>
          <div class="result-tabs" id="result-tabs"></div>
          <div class="grid-toolbar" id="grid-toolbar"></div>
          <div class="grid-host" id="grid-host"></div>
        </div>
      </section>

      <footer class="statusbar" id="statusbar">
        <span id="status-left" class="status-left"></span>
        <span class="spacer"></span>
        <span id="status-right" class="status-right"></span>
      </footer>
    </main>
  </div>

  <div class="overlay hidden" id="overlay"></div>
  <div class="toast-host" id="toast-host"></div>

  <script src="bundle.js"></script>
</body>
</html>
